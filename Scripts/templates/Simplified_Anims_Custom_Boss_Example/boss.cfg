; Required: no
; Default: free_cum_anim
;egg_anim=""

; egg_anim_speed_modifier
; Type: number, 0.01-10 (1 = normal speed).
; Description: speeds up or slows down the egg videos, applied when packing.
;   Ignored when auto_fit_egg_anim_length=true, and for pictures.
; Required: no
; Default: 1.0
;egg_anim_speed_modifier=1.0

; auto_fit_egg_anim_length
; Type: true or false.
; Description: fitted length: 2.0 s (the egg laying animation). true fits
;   each egg video to it. Makes egg_anim_speed_modifier ignored. Only
;   auto-fitted videos get the sped-up copies of anim_acceleration_steps
;   (mod_settings.cfg).
; Required: no
; Default: false
;auto_fit_egg_anim_length=false

; lose_anim
; Type: file name(s), see above.
; Description: plays once from the start when you run out of stamina and cum
