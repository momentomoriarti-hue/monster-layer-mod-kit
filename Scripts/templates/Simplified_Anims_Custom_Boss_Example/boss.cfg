; Custom boss settings.
; A custom boss can replace the dragon, the end boss of a run (after the 10th
; won fight). It uses the dragon's fight: its attacks, its special hearts, 3
; rounds with stamina recovery between them and its game over screen; this file
; sets its name, body, sounds and animations.
; To make your own boss, copy this folder, rename the copy (the folder name is
; the boss's id) and edit this file. Set active=false to switch it off.
; Then run Scripts\pack-moded.bat.
;
; Every field is described the same way:
;   1. the field name
;   2. Type: its type and possible values
;   3. Description: what it does in the game; which other fields can make it
;      ignored, and which other fields it makes ignored
;   4. Required: yes or no
;   5. Default: the value used when the field isn't set
;   6. the field with its default value; commented out (;) if it isn't required.
;      Remove the ; and change the value to use it.
; Text values go in quotes: name="Mira". Numbers and true/false don't.
; An empty value ("") means the default.

[boss]

; active
; Type: true or false.
; Description: false switches this boss off: it isn't packed into the game and
;   never appears, as if its folder wasn't there. Handy to keep a boss you're
;   not using yet. With disable_default_boss=true (mod_settings.cfg), only active
;   ones count.
;   This example is switched off (active=false); set it to true, or remove
;   the line, to use it.
; Required: no
; Default: true
active=false

; ---- Who the boss is ----

; name
; Type: text.
; Description: the boss's name. The intro before the fight says "To lay <name>"
;   instead of "To lay the dragon".
; Required: no
; Default: the folder name
;name=""

; genitals
; Type: one of "pussy", "dick".
; Description: the boss's genitals (the dragon's come from the highest
;   slider). Together with chest it picks the slider used by chance. With
;   "pussy", dick_size is ignored.
; Required: yes
; Default: none
genitals="pussy"

; chest
; Type: one of "boobs" (female), "flat" (male).
; Description: the boss's chest (the dragon's comes from the highest slider).
;   Together with genitals it picks the slider used by chance. With "flat",
;   boob_size is ignored.
; Required: yes
; Default: none
chest="boobs"

; base_chance
; Type: number, 0 or more (percent of the dragon's chance; no upper limit).
; Description: how likely this boss is to replace the dragon when a run reaches
;   its end boss. The dragon always takes the body of the highest run start
;   slider, so a custom boss counts against that slider: its weight is
;   chance / 100 x the slider for its chest + genitals / the highest slider, and
;   the dragon's weight is 1. With 100 and this boss's body being the favourite
;   one it's 50/50 with the dragon; with that slider at half the highest, 1/3;
;   with it at 0 the boss never appears. With several custom bosses all their
;   weights and the dragon's 1 are shared out the same way.
;   chance_per_defeated, max_chance, min_defeated and max_defeated below change
;   it as the run goes on. (Older versions of the kit called it chance;
;   chance= still works.)
; Required: no
; Default: 100
;base_chance=100

; chance_per_defeated
; Type: number, can be negative (percent of the dragon's chance).
; Description: added to base_chance for every boss defeated in this run (added,
;   not multiplied); only bosses count, not Lays. The first end boss of a run
;   is rolled with 0 defeated bosses, and in endless mode every loop adds one:
;   the end boss of the second loop is rolled with 1, of the third with 2. For
;   example base_chance=0 with chance_per_defeated=50: never in the first loop,
;   50 in the second, 100 in the third. The chance never goes below 0 and stops
;   at max_chance.
; Required: no
; Default: 0
;chance_per_defeated=0

; max_chance
; Type: number, 0 or more (percent of the dragon's chance).
; Description: the highest chance this boss can reach with chance_per_defeated
;   (a higher base_chance is lowered to it too). Empty = no limit.
; Required: no
; Default: no limit
;max_chance=""

; min_defeated
; Type: whole number, 0 or more.
; Description: this boss can only be rolled once at least this many bosses
;   were defeated in this run; before that it isn't in the pool at all. For
;   example 1 = only from the second loop of endless mode on.
; Required: no
; Default: 0
;min_defeated=0

; max_defeated
; Type: whole number, 0 or more.
; Description: this boss leaves the pool once more than this many bosses were
;   defeated in this run. For example 0 = only as the first end boss of a run.
;   Empty = it never leaves.
; Required: no
; Default: no limit
;max_defeated=""

; boob_size
; Type: one of "tiny", "small", "average", "large", "huge", or a number 0.8-1.2
;   (the game's scale: tiny 0.84, small 0.92, average 1.0, large 1.08,
;   huge 1.16).
; Description: boob size of the dragon's sprites, used when no sex animation
;   is set. Ignored with chest="flat".
; Required: no
; Default: random 0.9-1.2, rolled when the fight starts
;boob_size=""

; dick_size
; Type: one of "mini", "little", "average", "hefty", "massive", or a number
;   0.8-1.5 (the game's scale: mini 0.87, little 1.01, average 1.15,
;   hefty 1.29, massive 1.43).
; Description: dick size of the dragon's sprites, used when no sex animation
;   is set. Ignored with genitals="pussy".
; Required: no
; Default: random 0.8-1.5, rolled when the fight starts
;dick_size=""

; mute_native_plap_sound
; Type: true or false.
; Description: true turns off the game's plap sounds (on every thrust and pound
;   hit, and on cum) while you fight this boss. Use it when the sex videos have
;   their own sound.
; Required: no
; Default: false
;mute_native_plap_sound=false

; mute_native_moan
; Type: true or false.
; Description: true turns off the game's moans of this boss. Use it when the
;   sex videos have their own sound.
; Required: no
; Default: false
;mute_native_moan=false

; ---- Sex animations (they replace the models in the round) ----
; Every *_anim field takes file names in this folder: videos (mp4, m4v, webm,
; mov, mkv, avi, wmv, flv, mpg, mpeg, gif, ogv) or pictures (png, jpg, jpeg,
; webp, bmp, tga). Several files can be listed, comma-separated or as an array:
;   thrust_anim="sex1.mp4, sex2.mp4"
;   thrust_anim=["sex1.mp4", "sex2.webm", "still.png"]
; One file is picked at random every time the animation starts. Videos are
; converted for Godot when packing; their sound is kept and plays at the game's
; SFX volume. The *_speed_modifier and auto_fit_* fields apply to each video
; separately. Times are given at 0 Pleasure: as Pleasure rises the game gets up
; to 1.5x faster, while a video keeps its speed (see disable_anim_acceleration_
; with_pleasure and anim_acceleration_steps in mod_settings.cfg).

; thrust_anim
; Type: file name(s), see above.
; Description: plays during a thrust (a click: one deep stroke, 1.0 s, the hit
;   at 0.2 s; it starts when you release the button). Setting it (or
;   pound_anim) hides the dragon's sprites in the round. A picture bobs up and
;   zooms in 10% on every thrust. It is also the fallback for every other
;   animation that isn't set, and pound_anim uses it when pound_anim is empty.
; Required: no
; Default: none (the dragon's sprites are shown)
;thrust_anim=""

; thrust_anim_speed_modifier
; Type: number, 0.01-10 (1 = normal speed).
; Description: speeds up or slows down the thrust videos, applied when
;   packing. Ignored when auto_fit_thrust_anim_length=true, and for pictures.
; Required: no
; Default: 1.0
;thrust_anim_speed_modifier=1.0

; auto_fit_thrust_anim_length
; Type: true or false.
; Description: fitted length: 1.0 s (one thrust). true fits each thrust
;   video to exactly one thrust: the whole video plays in 1.0 s. The hit
;   (deepest moment) is at 0.2 s, so cut the video to one stroke with its
;   deepest moment at 1/5 of its length. At full Pleasure the game's thrust
;   takes 0.67 s (hit at 0.13 s). Makes thrust_anim_speed_modifier ignored.
;   Only auto-fitted videos get the sped-up copies of anim_acceleration_steps
;   (mod_settings.cfg).
; Required: no
; Default: false
;auto_fit_thrust_anim_length=false

; thrust_anim_reset_on_pause
; Type: true or false.
; Description: true starts the thrust video from the beginning (with a new
;   random file) on every thrust; false pauses it when the thrust ends and
;   continues from there on the next one (a new random file is picked when it
;   finishes). Ignored for pictures. Only matters for a pause when idle_anim
;   isn't set.
; Required: no
; Default: false
;thrust_anim_reset_on_pause=false

; pound_anim
; Type: file name(s), see above.
; Description: plays while you pound (hold the button: fast shallow strokes,
;   a 0.5 s loop, each hit at 0.2 s of it). Pounding starts 0.2 s after you
;   press; after you release, the current stroke and an exit stroke (0.45 s)
;   finish. The video loops while you hold, with a new random file each loop.
;   A picture bobs up and zooms in 5% on every stroke. Setting it (or
;   thrust_anim) hides the dragon's sprites in the round.
; Required: no
; Default: the thrust_anim files
;pound_anim=""

; pound_anim_speed_modifier
; Type: number, 0.01-10 (1 = normal speed).
; Description: speeds up or slows down the pound videos, applied when
;   packing. Ignored when auto_fit_pound_anim_length=true, and for pictures.
; Required: no
; Default: 1.0
;pound_anim_speed_modifier=1.0

; auto_fit_pound_anim_length
; Type: true or false.
; Description: fitted length: 0.5 s (one pound stroke). true fits each pound
;   video to exactly one pound stroke: the whole video plays in 0.5 s and
;   loops while you hold (the game's stroke is 0.33 s at full Pleasure).
;   Makes pound_anim_speed_modifier ignored. Only auto-fitted videos get the
;   sped-up copies of anim_acceleration_steps (mod_settings.cfg).
; Required: no
; Default: false
;auto_fit_pound_anim_length=false

; pound_anim_reset_on_pause
; Type: true or false.
; Description: true starts the pound video from the beginning when you stop
;   pounding; false pauses it and continues from there next time. Ignored for
;   pictures. Only matters when idle_anim isn't set.
; Required: no
; Default: false
;pound_anim_reset_on_pause=false

; ---- Other moments of the round ----
; If one of these isn't set, the next one in its fallback list is used, and in
; the end thrust_anim. Pictures here are shown still, without bobbing.

; idle_anim
; Type: file name(s), see above.
; Description: plays when you aren't fucking (between strokes), looping, with
;   a new random file each loop. When set, thrust_anim_reset_on_pause and
;   pound_anim_reset_on_pause no longer matter for pauses.
; Required: no
; Default: none (the thrust / pound video stays paused)
;idle_anim=""

; idle_anim_speed_modifier
; Type: number, 0.01-10 (1 = normal speed).
; Description: speeds up or slows down the idle videos, applied when packing.
;   Ignored when auto_fit_idle_anim_length=true, and for pictures.
; Required: no
; Default: 1.0
;idle_anim_speed_modifier=1.0

; auto_fit_idle_anim_length
; Type: true or false.
; Description: fitted length: 2.0 s (the game's idle loop). true fits each
;   idle video to it. Makes idle_anim_speed_modifier ignored. Only auto-fitted
;   videos get the sped-up copies of anim_acceleration_steps
;   (mod_settings.cfg).
; Required: no
; Default: false
;auto_fit_idle_anim_length=false

; free_cum_anim
; Type: file name(s), see above.
; Description: plays once from the start when a free cum perk turns a thrust
;   into a cum shot: 2.0 s (1.33 s at full Pleasure), the cum hits at 0.7 s
;   (0.47 s). Also the fallback of egg_anim and lose_anim.
; Required: no
; Default: thrust_anim
;free_cum_anim=""

; free_cum_anim_speed_modifier
; Type: number, 0.01-10 (1 = normal speed).
; Description: speeds up or slows down the free cum videos, applied when
;   packing. Ignored when auto_fit_free_cum_anim_length=true, and for pictures.
; Required: no
; Default: 1.0
;free_cum_anim_speed_modifier=1.0

; auto_fit_free_cum_anim_length
; Type: true or false.
; Description: fitted length: 2.0 s (the free cum animation; 1.33 s at full
;   Pleasure). true fits each free cum video to it. Makes
;   free_cum_anim_speed_modifier ignored. Only auto-fitted videos get the
;   sped-up copies of anim_acceleration_steps (mod_settings.cfg).
; Required: no
; Default: false
;auto_fit_free_cum_anim_length=false

; egg_anim
; Type: file name(s), see above.
; Description: plays once from the start instead of free_cum_anim when you
;   play as Sylvia (egg laying, 1-3 eggs): 2.0 s; eggs land at 1.4 s (1 egg),
;   at 1.3 and 1.6 s (2), or at 1.3, 1.6 and 1.8 s (3). Also the first
