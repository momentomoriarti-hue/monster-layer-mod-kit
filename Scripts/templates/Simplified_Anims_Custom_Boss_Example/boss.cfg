; ---- The intro before the fight ----
; The dragon's intro is a white screen with the text "It is time" and "To lay
; <name>"; the boss appears behind it at 6 s and the white fades out from 7 to
; 8 s, when the fight starts.

; intro_anim
; Type: file name(s), see above.
; Description: shown on the white intro screen under the text, from its start
;   until it fades out with the white at 7-8 s; one file is picked at random. A
;   video plays once (its last frame stays on). It is only shown for this boss
;   (the dragon keeps its plain intro).
; Required: no
; Default: none (only the text)
;intro_anim=""

; intro_anim_speed_modifier
; Type: number, 0.01-10 (1 = normal speed).
; Description: speeds up or slows down the intro videos, applied when packing.
;   Ignored when auto_fit_intro_anim_length=true, and for pictures.
; Required: no
; Default: 1.0
;intro_anim_speed_modifier=1.0

; auto_fit_intro_anim_length
; Type: true or false.
; Description: fitted length: 7.0 s (until the white starts fading out). true
;   fits each intro video to it. Makes intro_anim_speed_modifier ignored.
; Required: no
; Default: false
;auto_fit_intro_anim_length=false
