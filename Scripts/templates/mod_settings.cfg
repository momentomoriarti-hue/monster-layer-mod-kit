; Monster Layer Mod Kit settings for the whole mod.
; Edit it in the Mod Kit app: Config on the mod's screen. The values are packed
; into the game, so changing them needs a new pack.
;
; Every field is described the same way:
;   1. the field name
;   2. Type: its type and possible values
;   3. Description: what it does in the game; which other fields can make it
;      ignored, and which other fields it makes ignored
;   4. Required: yes or no
;   5. Default: the value used when the field isn't set
;   6. the field with its default value; commented out (;) if it isn't required.
;      Remove the ; and change the value to use it.

[settings]

; disable_anim_acceleration_with_pleasure
; Type: true or false.
; Description: true stops the round from speeding up as Pleasure rises. In the
;   original game everything in the round gets up to 1.5x faster at full
;   Pleasure: the models' animation, the time between strokes and hits, egg
;   laying and sound delays, and plaps get up to 4 dB louder. With true all of
;   that stays at normal speed, so custom videos always match the game's
;   timings, and the orgasm lasts 4.5 s instead of 3.0 s (auto_fit_orgasm_anim_
;   length uses that). It changes the balance: late in a round you hit up to
;   1.5x less often, so rounds take longer and you take more heart damage.
;   Makes anim_acceleration_steps ignored.
; Required: no
; Default: false
;disable_anim_acceleration_with_pleasure=false

; anim_acceleration_steps
; Type: whole number, 1 or more (no upper limit).
; Description: how many sped-up copies Lay and boss videos get, to follow the
;   game's speed-up: it goes smoothly from x1 at 0% Pleasure to x1.5 at 100%,
;   but a video can't change its speed while playing. When packing, every
;   video with auto_fit_<kind>_anim_length=true (thrust, pound, idle, free_cum,
;   egg, lose) is converted this many times; copy k (counting from 0) is used
;   from k/steps to (k+1)/steps of Pleasure and plays at x(1 + 0.5 * k / steps)
;   of the fitted speed, the game's own speed at the start of that range.
;   Example, 4 steps: 0-25% x1, 25-50% x1.125, 50-75% x1.25, 75-100% x1.375.
;   A looping video switches to another copy only when it finishes a loop,
;   never in the middle; one-shot videos pick their copy when they start.
;   1 = off. Ignored when disable_anim_acceleration_with_pleasure=true. Doesn't
;   apply to videos without auto-fit, pictures, the orgasm (always at full
;   Pleasure) or hypno. Each copy is limited by
;   downgrade_all_animations_fps_to.
;   WARNING: every step is a full extra copy of each of those videos inside the
;   packed game: 10 steps make them take about 10 times more space and make
;   packing that much slower. 3-5 steps are usually enough.
; Required: no
; Default: 1
;anim_acceleration_steps=1

; downgrade_all_animations_fps_to
; Type: number, 1-240 (frames per second).
; Description: the highest frame rate of every converted video. A converted
;   video keeps its source frames, so its frame rate is the source frame rate
;   times its speed (a 30 fps video at x4 would be 120 fps). Any video that
;   would come out above this value, including the sped-up copies of
;   anim_acceleration_steps, has frames dropped evenly down to it. Lower =
;   smaller files and lighter playback, less smooth motion; 60 matches most
;   monitors. Pictures aren't affected.
; Required: no
; Default: 60
;downgrade_all_animations_fps_to=60

; disable_default_lays
; Type: true or false.
; Description: true stops the game's own Lays from appearing: the first Lay of a
;   run and all 3 Lays you choose from are always custom Lays (from
;   Custom Lays), and the rare characters (Xerxes, Zephyr) don't appear either.
;   The custom Lays share the slots by their chance and body sliders; if every
;   custom Lay's body slider is at 0, the sliders are ignored so a Lay can still
;   be picked. The tutorial's kobold is replaced by a custom Lay too.
;   Packing stops with an error if this is true and there are no active
;   custom Lays.
; Required: no
; Default: false
;disable_default_lays=false

; disable_default_boss
; Type: true or false.
; Description: true stops the dragon from being the end boss: one of the custom
;   bosses (from Custom Bosses) is always picked, by their chance and body
;   sliders; if every custom boss's body slider is at 0, the sliders are ignored
;   so a boss can still be picked. Ero (the optional post-game boss) isn't
;   affected. Packing stops with an error if this is true and there are
;   no active custom bosses.
; Required: no
; Default: false
;disable_default_boss=false
