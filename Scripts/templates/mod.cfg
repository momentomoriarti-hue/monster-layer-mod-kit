; Monster Layer Mod Kit: this mod's settings for the kit itself. Unlike
; mod_settings.cfg, this file isn't packed into the game or into the source zip.
; The Mod Kit app edits it for you (Config on the mod's screen).
;
; Every field is described the same way:
;   1. the field name
;   2. Type: its type and possible values
;   3. Description: what it does
;   4. Required: yes or no
;   5. Default: the value used when the field isn't set
;   6. the field with its default value; commented out (;) if it isn't required.
;      Remove the ; and change the value to use it.

[mod]

; name
; Type: text.
; Description: the mod's name, shown in the Mod Kit app and used for the source
;   zip's file name ("<name> (source).zip").
; Required: no
; Default: the folder name
;name=""

; pack_as
; Type: one of "zip", "pck", "both".
; Description: what Pack makes. "zip" = the open source zip (only configs,
;   videos and pictures) that players check and build themselves with the
;   Player Tools: the safest way to share a mod. "pck" = a ready .pck in
;   Moded Packed\Release, which players have to trust or check. "both" = both.
; Required: no
; Default: "zip"
;pack_as="zip"
