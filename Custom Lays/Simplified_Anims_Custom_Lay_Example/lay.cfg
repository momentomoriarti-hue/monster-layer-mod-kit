; Custom Lay (custom opponent) settings.
; To make your own Lay, copy this folder, rename the copy (the folder name is the
; Lay's id) and edit this file. Set active=false to switch it off.
; Then run Scripts\pack-moded.bat.
;
; Every field is described the same way:
;   1. the field name
;   2. Type: its type and possible values
;   3. Description: what it does in the game; which other fields can make it
;      ignored, and which other fields it makes ignored
;   4. Required: yes or no
;   5. Default: the value used when the field isn't set
;   6. the field with its default value; commented out (;) if it isn't required.
;      Remove the ; and change the value to use it.
; Text values go in quotes: name="Mira". Numbers and true/false don't.
; An empty value ("") means the default.

[lay]

; active
; Type: true or false.
; Description: false switches this Lay off: it isn't packed into the game and
;   never appears, as if its folder wasn't there. Handy to keep a Lay you're
;   not using yet. With disable_default_lays=true (mod_settings.cfg), only active
;   ones count.
;   This example is switched off (active=false); set it to true, or remove
;   the line, to use it.
; Required: no
; Default: true
active=false

; ---- Who the Lay is ----

; name
; Type: text.
; Description: the Lay's name, shown on the "Choose your next Lay" screen and in
;   the round.
; Required: no
; Default: the folder name
;name=""

; genitals
; Type: one of "pussy", "dick".
; Description: the Lay's genitals. Together with chest it picks the body
;   preference slider used by chance. With "pussy", dick_size is ignored.
; Required: yes
; Default: none
genitals="pussy"

; chest
; Type: one of "boobs" (female), "flat" (male).
; Description: the Lay's chest. Together with genitals it picks the body
;   preference slider used by chance. With "flat", boob_size is ignored, and the
;   default pronoun is "(he/him)" instead of "(she/her)".
; Required: yes
; Default: none
chest="boobs"

; chance
; Type: number, 0 or more (percent of one species' chance; no upper limit).
; Description: how likely this Lay is to be generated, compared with the game's
;   own species. The game picks a normal Lay's species evenly (1 of 9), then its
;   body with the run start sliders (slider / sum of all 4 sliders). A custom
;   Lay is one more species in that roll, with its fixed chest + genitals: with
;   100 it is exactly as likely as any one species with the same body (for
;   example a kobold with boobs and a pussy), 200 = twice as likely, 50 = half,
;   0 = never. Checked separately for the first Lay of a run and for each of the
;   3 Lays you choose from after a win. With the slider for its chest + genitals
;   at 0 it never appears. Normal Lays always stay possible; the more custom
;   Lays (and the higher their chance), the rarer they get.
; Required: no
; Default: 100
;chance=100

; boob_size
; Type: one of "tiny", "small", "average", "large", "huge", or a number 0.8-1.2
;   (the game's scale: tiny 0.84, small 0.92, average 1.0, large 1.08,
;   huge 1.16).
; Description: boob size shown in the profile ("-Large tits") and used for the
;   species' sprites when no sex animation is set. Ignored with chest="flat".
; Required: no
; Default: random 0.9-1.2, rolled anew every time the Lay appears in the
;   choice pool
;boob_size=""

; dick_size
; Type: one of "mini", "little", "average", "hefty", "massive", or a number
;   0.8-1.5 (the game's scale: mini 0.87, little 1.01, average 1.15,
;   hefty 1.29, massive 1.43).
; Description: dick size shown in the profile ("-Hefty cock") and used for the
;   species' sprites when no sex animation is set. Ignored with
;   genitals="pussy".
; Required: no
; Default: random 0.8-1.5, rolled anew every time the Lay appears in the
;   choice pool
;dick_size=""

; pronoun
; Type: text, for example "(she/they)".
; Description: pronouns shown next to the name on the "Choose your next Lay"
;   screen; they also pick "girl" / "boy" / "cutie" in the bio.
; Required: no
; Default: "(she/her)" with chest="boobs", "(he/him)" with chest="flat"
;pronoun=""

; base_species
; Type: one of "kobold", "ratfolk", "gnoll", "kenku", "hellhound", "foxspirit",
;   "sahuagin", "snakekin", "cattails".
; Description: the game's own species this Lay is built on: its attacks, voice
;   and colors, its portrait (unless portrait is set) and its sprites in the
;   round (unless thrust_anim / pound_anim are set, which hide them).
; Required: no
; Default: one species picked from the folder name; it stays the same for
;   this Lay
;base_species=""

; portrait
; Type: file name of a picture in this folder (png, jpg, jpeg, webp, bmp, tga).
; Description: picture in the Lay's profile on the "Choose your next Lay"
;   screen, in a square 250x250 frame: a square picture (for example 400x400)
;   fits fully, other shapes are scaled to fill the frame and cropped. When set,
;   the base_species portrait isn't used.
; Required: no
; Default: the base_species portrait
;portrait=""

; mute_native_plap_sound
; Type: true or false.
; Description: true turns off the game's plap sounds (on every thrust and pound
;   hit, and on cum) while you fight this Lay. Use it when the sex videos have
;   their own sound.
; Required: no
; Default: false
;mute_native_plap_sound=false

; mute_native_moan
; Type: true or false.
; Description: true turns off the game's moans of this Lay. Use it when the
;   sex videos have their own sound.
; Required: no
; Default: false
;mute_native_moan=false

; traits
; Type: list of 0-3 trait ids, comma-separated or as an array:
;   traits="pound+, thrust-"   or   traits=["pound+", "thrust-"]
;   Each id is a trait name with + (the Lay likes it) or - (doesn't):
;   thrust+  "Really love being fucked hard <3"    thrust-  "Don't fuck me too hard!"
;   pound+   "I like getting fucked fast <3"       pound-   "I like it a bit slower"
;   arousal+ "Getting teased is such a big turn on!"
;   arousal- "Let's just skip the teasing, alright <3"
;   cum+     "I wanna be bred <3"                  cum-     "I'm hard to breed"
;   lucky+   "I always get what I want, guess i'm lucky :3"
;   lucky-   "I'm a little unlucky, sure things will be ok"
;   heart+   "I'm a very tender lover owo"         heart-   "I'm not exactly tender in bed ;3"
;   intimate+ "I'm very intimate <3"               intimate- "I have trouble with intimacy"
;   feral+   "I want someone to go feral on me"    feral-   "Don't be too feral"
;   hypno+   "I love to be controlled"             hypno-   "I'm hard to control"
;   sticky+  "I love to getting sticky"            sticky-  "I don't like getting sticky"
; Description: traits this Lay always has; they are shown in its profile and
;   change the matching mechanic by +-30% like the game's own traits. The game
;   still rolls how many traits a Lay has (1-3, more in later fights, with 1-2
;   forced negative ones from difficulty 5 / 8 on); the fixed ones fill the
;   first slots and any slots left get random traits that never repeat or
;   contradict them. With more fixed traits than the roll, the Lay just has all
;   fixed ones. The first Lay of a run (no traits in the game) gets only the
;   fixed ones. Some traits exist only for some player characters (intimate:
;   Jon, Ferro, Sylvia; feral: Barks, Oro; hypno: Drip; sticky: Sylvia); with
;   another character such a fixed trait is left out. The same trait twice, a
;   trait together with its opposite (pound+ and pound-), an unknown id or more
;   than 3 traits stop pack-moded.bat with an error.
; Required: no
; Default: none (all traits random, like normal Lays)
;traits=""

; ---- Sex animations (they replace the models in the round) ----
; Every *_anim field takes file names in this folder: videos (mp4, m4v, webm,
; mov, mkv, avi, wmv, flv, mpg, mpeg, gif, ogv) or pictures (png, jpg, jpeg,
; webp, bmp, tga). Several files can be listed, comma-separated or as an array:
;   thrust_anim="sex1.mp4, sex2.mp4"
;   thrust_anim=["sex1.mp4", "sex2.webm", "still.png"]
; One file is picked at random every time the animation starts. Videos are
; converted for Godot when packing; their sound is kept and plays at the game's
; SFX volume. The *_speed_modifier and auto_fit_* fields apply to each video
; separately. Times are given at 0 Pleasure: as Pleasure rises the game gets up
; to 1.5x faster, while a video keeps its speed (see disable_anim_acceleration_
; with_pleasure and anim_acceleration_steps in mod_settings.cfg).

; thrust_anim
; Type: file name(s), see above.
; Description: plays during a thrust (a click: one deep stroke, 1.0 s, the hit
;   at 0.2 s; it starts when you release the button). Setting it (or
;   pound_anim) hides the species' sprites in the round. A picture bobs up and
;   zooms in 10% on every thrust. It is also the fallback for every other
;   animation that isn't set, and pound_anim uses it when pound_anim is empty.
; Required: no
; Default: none (the species' sprites are shown)
;thrust_anim=""

; thrust_anim_speed_modifier
; Type: number, 0.01-10 (1 = normal speed).
; Description: speeds up or slows down the thrust videos, applied when
;   packing. Ignored when auto_fit_thrust_anim_length=true, and for pictures.
; Required: no
; Default: 1.0
;thrust_anim_speed_modifier=1.0

; auto_fit_thrust_anim_length
; Type: true or false.
; Description: fitted length: 1.0 s (one thrust). true fits each thrust
;   video to exactly one thrust: the whole video plays in 1.0 s. The hit
;   (deepest moment) is at 0.2 s, so cut the video to one stroke with its
;   deepest moment at 1/5 of its length. At full Pleasure the game's thrust
;   takes 0.67 s (hit at 0.13 s). Makes thrust_anim_speed_modifier ignored.
;   Only auto-fitted videos get the sped-up copies of anim_acceleration_steps
;   (mod_settings.cfg).
; Required: no
; Default: false
;auto_fit_thrust_anim_length=false

; thrust_anim_reset_on_pause
; Type: true or false.
; Description: true starts the thrust video from the beginning (with a new
;   random file) on every thrust; false pauses it when the thrust ends and
;   continues from there on the next one (a new random file is picked when it
;   finishes). Ignored for pictures. Only matters for a pause when idle_anim
;   isn't set.
; Required: no
; Default: false
;thrust_anim_reset_on_pause=false

; pound_anim
; Type: file name(s), see above.
; Description: plays while you pound (hold the button: fast shallow strokes,
;   a 0.5 s loop, each hit at 0.2 s of it). Pounding starts 0.2 s after you
;   press; after you release, the current stroke and an exit stroke (0.45 s)
;   finish. The video loops while you hold, with a new random file each loop.
;   A picture bobs up and zooms in 5% on every stroke. Setting it (or
;   thrust_anim) hides the species' sprites in the round.
; Required: no
; Default: the thrust_anim files
;pound_anim=""

; pound_anim_speed_modifier
; Type: number, 0.01-10 (1 = normal speed).
; Description: speeds up or slows down the pound videos, applied when
;   packing. Ignored when auto_fit_pound_anim_length=true, and for pictures.
; Required: no
; Default: 1.0
;pound_anim_speed_modifier=1.0

; auto_fit_pound_anim_length
; Type: true or false.
; Description: fitted length: 0.5 s (one pound stroke). true fits each pound
;   video to exactly one pound stroke: the whole video plays in 0.5 s and
;   loops while you hold (the game's stroke is 0.33 s at full Pleasure).
;   Makes pound_anim_speed_modifier ignored. Only auto-fitted videos get the
;   sped-up copies of anim_acceleration_steps (mod_settings.cfg).
; Required: no
; Default: false
;auto_fit_pound_anim_length=false

; pound_anim_reset_on_pause
; Type: true or false.
; Description: true starts the pound video from the beginning when you stop
;   pounding; false pauses it and continues from there next time. Ignored for
;   pictures. Only matters when idle_anim isn't set.
; Required: no
; Default: false
;pound_anim_reset_on_pause=false

; ---- Other moments of the round ----
; If one of these isn't set, the next one in its fallback list is used, and in
; the end thrust_anim. Pictures here are shown still, without bobbing.

; idle_anim
; Type: file name(s), see above.
; Description: plays when you aren't fucking (between strokes), looping, with
;   a new random file each loop. When set, thrust_anim_reset_on_pause and
;   pound_anim_reset_on_pause no longer matter for pauses.
; Required: no
; Default: none (the thrust / pound video stays paused)
;idle_anim=""

; idle_anim_speed_modifier
; Type: number, 0.01-10 (1 = normal speed).
; Description: speeds up or slows down the idle videos, applied when packing.
;   Ignored when auto_fit_idle_anim_length=true, and for pictures.
; Required: no
; Default: 1.0
;idle_anim_speed_modifier=1.0

; auto_fit_idle_anim_length
; Type: true or false.
; Description: fitted length: 2.0 s (the game's idle loop). true fits each
;   idle video to it. Makes idle_anim_speed_modifier ignored. Only auto-fitted
;   videos get the sped-up copies of anim_acceleration_steps
;   (mod_settings.cfg).
; Required: no
; Default: false
;auto_fit_idle_anim_length=false

; free_cum_anim
; Type: file name(s), see above.
; Description: plays once from the start when a free cum perk turns a thrust
;   into a cum shot: 2.0 s (1.33 s at full Pleasure), the cum hits at 0.7 s
;   (0.47 s). Also the fallback of egg_anim and lose_anim.
; Required: no
; Default: thrust_anim
;free_cum_anim=""

; free_cum_anim_speed_modifier
; Type: number, 0.01-10 (1 = normal speed).
; Description: speeds up or slows down the free cum videos, applied when
;   packing. Ignored when auto_fit_free_cum_anim_length=true, and for pictures.
; Required: no
; Default: 1.0
;free_cum_anim_speed_modifier=1.0

; auto_fit_free_cum_anim_length
; Type: true or false.
; Description: fitted length: 2.0 s (the free cum animation; 1.33 s at full
